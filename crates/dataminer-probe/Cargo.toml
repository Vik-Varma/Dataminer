[package]
name = "dataminer-probe"
description = "The headless client that measures our own strict Bedrock Dedicated Server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Joins the server and frames packets. MIT. The probe sends every PlayerAuthInput itself and uses
# none of Acacia's physics: what it logs is only what the server said.
acacia-client = { git = "https://github.com/Vik-Varma/acacia", rev = "6323d43a4c5d474ef6981e3faaff861a5d3081ac", default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros"] }

[lints]
workspace = true
